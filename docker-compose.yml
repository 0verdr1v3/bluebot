# ─────────────────────────────────────────────────────────────
# GENERATED by scripts/gen_compose.py — edit that script, not this file.
# A grid of independent Android instances (redroid) + a web panel viewer
# (ws-scrcpy). View everything at http://localhost:8000
# ─────────────────────────────────────────────────────────────
services:

  android-1:
    image: redroid/redroid:11.0.0-latest
    container_name: redroid-1
    privileged: true
    # Each instance gets its own ADB port on the host: 5555, 5556, ...
    ports:
      - "5555:5555"
    volumes:
      - ./data/android-1:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_fps=30
      # GPU is off by default for portability; flip to host for speed if your
      # host has a GPU + drivers passed through.
      - androidboot.redroid_gpu_mode=guest
    restart: unless-stopped

  android-2:
    image: redroid/redroid:11.0.0-latest
    container_name: redroid-2
    privileged: true
    # Each instance gets its own ADB port on the host: 5555, 5556, ...
    ports:
      - "5556:5555"
    volumes:
      - ./data/android-2:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_fps=30
      # GPU is off by default for portability; flip to host for speed if your
      # host has a GPU + drivers passed through.
      - androidboot.redroid_gpu_mode=guest
    restart: unless-stopped

  android-3:
    image: redroid/redroid:11.0.0-latest
    container_name: redroid-3
    privileged: true
    # Each instance gets its own ADB port on the host: 5555, 5556, ...
    ports:
      - "5557:5555"
    volumes:
      - ./data/android-3:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_fps=30
      # GPU is off by default for portability; flip to host for speed if your
      # host has a GPU + drivers passed through.
      - androidboot.redroid_gpu_mode=guest
    restart: unless-stopped

  android-4:
    image: redroid/redroid:11.0.0-latest
    container_name: redroid-4
    privileged: true
    # Each instance gets its own ADB port on the host: 5555, 5556, ...
    ports:
      - "5558:5555"
    volumes:
      - ./data/android-4:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_fps=30
      # GPU is off by default for portability; flip to host for speed if your
      # host has a GPU + drivers passed through.
      - androidboot.redroid_gpu_mode=guest
    restart: unless-stopped

  viewer:
    build: ./ws-scrcpy
    container_name: ws-scrcpy
    ports:
      - "8000:8000"
    # The viewer adb-connects to each redroid instance over the internal
    # docker network (service name : internal port 5555).
    environment:
      DEVICES: "android-1:5555 android-2:5555 android-3:5555 android-4:5555"
    healthcheck:
      # node is already in the image; avoids needing curl/wget.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      - android-1
      - android-2
      - android-3
      - android-4
    restart: unless-stopped
